name: SVF-Python Build (Auto-install Python 3.10)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build via build.sh on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # SVF's build.sh pins the Ubuntu 26 LLVM prebuilts, whose clang needs
        # libxml2.so.16 (not available on Ubuntu 24.04).
        os: [ubuntu-26.04, macos-15]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl build-essential software-properties-common \
            cmake g++ nodejs doxygen graphviz lcov libncurses-dev libtinfo6 libzstd-dev \
            libffi-dev zlib1g-dev

      - name: Set up native LLVM 22 (Ubuntu 26.04)
        if: matrix.os == 'ubuntu-26.04'
        run: |
          sudo apt-get install -y llvm-22-dev clang-22
          echo "LLVM_DIR=/usr/lib/llvm-22" >> "$GITHUB_ENV"

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install git curl cmake node doxygen graphviz

      - name: Run build script
        run: |
          chmod +x ./build.sh
          ./build.sh

      - name: Check for .whl file
        run: |
          if ls dist/*.whl 1> /dev/null 2>&1; then
            echo "✅ Wheel build succeeded."
          else
            echo "❌ Wheel file not found. Build failed."
            exit 1
          fi
