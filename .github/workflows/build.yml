name: SVF-Python Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build via build.sh on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      PYTHON_EXEC: ${{ matrix.python-executable || 'python3' }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        include:
          - os: ubuntu-26.04
            python-executable: python3.14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl build-essential software-properties-common \
            cmake g++ nodejs doxygen graphviz lcov libncurses-dev libtinfo6 libzstd-dev \
            libffi-dev zlib1g-dev python3-dev python3-venv patchelf

      - name: Set up native LLVM 21 (Ubuntu 26.04)
        if: matrix.os == 'ubuntu-26.04'
        run: |
          # The Ubuntu 22.04 LLVM SDK requires libxml2.so.2, absent on Ubuntu 26.04.
          sudo apt-get install -y llvm-21-dev clang-21
          llvm-config-21 --version
          test "$(llvm-config-21 --has-rtti)" = YES
          echo "LLVM_DIR=$(llvm-config-21 --prefix)" >> "$GITHUB_ENV"
          /usr/lib/llvm-21/bin/clang --version

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install git curl cmake node doxygen graphviz

      - name: Run build script
        run: |
          chmod +x ./build.sh
          ./build.sh

      - name: Check for .whl file
        run: |
          if ls dist/*.whl 1> /dev/null 2>&1; then
            echo "✅ Wheel build succeeded."
          else
            echo "❌ Wheel file not found. Build failed."
            exit 1
          fi

      - name: Install and test wheel with Python 3.14
        if: matrix.os == 'ubuntu-26.04'
        working-directory: ${{ runner.temp }}
        env:
          WHEEL_DIR: ${{ github.workspace }}/dist
          BITCODE_PATH: ${{ github.workspace }}/test_cases/BASIC_array_2d_0-0.c.bc
        run: |
          "$PYTHON_EXEC" -m venv "$RUNNER_TEMP/svfpy-test-venv"
          "$RUNNER_TEMP/svfpy-test-venv/bin/python" -m pip install "$WHEEL_DIR"/*.whl
          "$RUNNER_TEMP/svfpy-test-venv/bin/python" -I - <<'PY'
          import os
          import sys
          import pysvf

          assert sys.version_info[:2] == (3, 14), sys.version
          print(f"Python: {sys.version}")
          print(f"Installed pysvf: {pysvf.__file__}")
          svfir = pysvf.get_svfir(os.environ["BITCODE_PATH"])
          assert svfir is not None, "SVFIR was not built"
          icfg = svfir.getICFG()
          assert icfg is not None, "ICFG was not built"
          nodes = icfg.getNodes()
          assert nodes, "ICFG has no nodes"
          print(f"ICFG nodes: {len(nodes)}")
          pysvf.releasePAG()
          PY
